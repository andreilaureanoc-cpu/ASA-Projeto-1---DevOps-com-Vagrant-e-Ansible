---
- name: Configura o host cliente.
  hosts: cli
  become: true

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

  tasks:
    - name: Instala o firefox-esr e o xauth.
      apt:
        name:
          - firefox-esr
          - xauth
        update_cache: yes
        state: present

    - name: Habilita a exportação de aplicações X11 no servidor ssh.
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
      loop:
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding yes' }
        - { regexp: '^#?X11UseLocalhost', line: 'X11UseLocalhost no' }
      notify: restart ssh
